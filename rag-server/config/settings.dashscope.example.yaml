# Modular RAG MCP Server — 阿里云百炼（OpenAI 兼容模式）示例配置
# 用法：cp config/settings.dashscope.example.yaml config/settings.yaml
# 将下方 api_key 替换为你的百炼 Key（与 agents-master/.env 中 DASHSCOPE_API_KEY 相同）

llm:
  provider: "openai"
  model: "qwen-max"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "sk-xxxxxxxx"
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: "openai"
  model: "text-embedding-v3"
  dimensions: 1024
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "sk-xxxxxxxx"

vision_llm:
  enabled: false
  provider: "openai"
  model: "qwen-vl-plus"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "sk-xxxxxxxx"
  max_image_size: 2048

vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "travel_plan"

retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: "none"
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 10  # 百炼 embedding 单次最多 10 条
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false
